name: Build Private LAN Screen Share APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Check project
        run: |
          echo "Checking Android project..."
          find mobile-companion -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: mobile-companion
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp mobile-companion/app/build/outputs/apk/debug/app-debug.apk PrivateLANScreenShare.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLANScreenShare
          path: PrivateLANScreenShare.apk
          if-no-files-found: error
